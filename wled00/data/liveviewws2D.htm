<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
	<meta charset="utf-8">
	<meta name="theme-color" content="#222222">
	<title>WLED Live Preview</title>
	<style>
	body {
		margin: 0;
		overflow: hidden;
	}
	#tools {
		position: fixed;
		top: 8px;
		right: 8px;
		z-index: 1;
		padding: 6px 8px;
		border-radius: 6px;
		background: rgba(32,32,32,.82);
		color: #ddd;
		font: 12px system-ui, sans-serif;
	}
	#tools input[type="number"] {
		width: 3em;
		margin-left: 4px;
		background: #111;
		color: #ddd;
		border: 1px solid #555;
	}
	</style>
</head>
<body>
	<div id="tools">
		<label><input id="wrapX" type="checkbox"> Wrap X</label>
		<label>Cols<input id="wrapCols" type="number" min="1" max="16" value="2"></label>
	</div>
	<canvas id="canv"></canvas>
	<script>
		// load common.js with retry on error
		(function common() {
			const l = document.createElement('script');
			l.src = 'common.js';
			l.onload = () => S();
			l.onerror = () => setTimeout(common, 100);
			document.head.appendChild(l);
		})();
		var c = document.getElementById('canv');
		var wrapX = localStorage.getItem('wledPeekWrapX') === 'true';
		var wrapCols = Math.max(1, Math.min(16, parseInt(localStorage.getItem('wledPeekWrapCols') || '2') || 2));
		var throttled = false;
		var ctx;
		function setCanvas() {
			c.width  = window.innerWidth * 0.98; //remove scroll bars
			c.height = window.innerHeight * 0.98; //remove scroll bars
		}
		function setWrapControls() {
			const wX = document.getElementById('wrapX');
			const wC = document.getElementById('wrapCols');
			wX.checked = wrapX;
			wC.value = wrapCols;
			wC.disabled = !wrapX;
			wX.addEventListener('change', () => {
				wrapX = wX.checked;
				wC.disabled = !wrapX;
				localStorage.setItem('wledPeekWrapX', wrapX);
			});
			wC.addEventListener('change', () => {
				wrapCols = Math.max(1, Math.min(16, parseInt(wC.value) || 2));
				wC.value = wrapCols;
				localStorage.setItem('wledPeekWrapCols', wrapCols);
			});
		}
		function drawFrame(leds) {
			if (!ctx) return;
			const mW = leds[2]; // matrix width
			const mH = leds[3]; // matrix height
			const extra = wrapX ? Math.min(wrapCols, mW) : 0;
			const viewW = mW + extra * 2;
			const pPL = Math.min(c.width / viewW, c.height / mH); // pixels per LED (width of circle)
			const lOf = Math.floor((c.width - pPL * viewW) / 2); //left offset (to center matrix)
			ctx.clearRect(0, 0, c.width, c.height);
			for (let y=0.5; y<mH; y++) for (let x=-extra+0.5; x<mW+extra; x++) {
				const srcX = (Math.floor(x) + mW) % mW;
				const i = 4 + ((Math.floor(y) * mW + srcX) * 3);
				ctx.fillStyle = `rgb(${leds[i]},${leds[i+1]},${leds[i+2]})`;
				ctx.beginPath();
				ctx.arc((x + extra) * pPL + lOf, y * pPL, pPL * 0.4, 0, 2 * Math.PI);
				ctx.fill();
			}
			if (extra) {
				ctx.strokeStyle = 'rgba(255,255,255,.5)';
				ctx.lineWidth = 1;
				ctx.beginPath();
				ctx.moveTo(lOf + extra * pPL, 0);
				ctx.lineTo(lOf + extra * pPL, mH * pPL);
				ctx.moveTo(lOf + (extra + mW) * pPL, 0);
				ctx.lineTo(lOf + (extra + mW) * pPL, mH * pPL);
				ctx.stroke();
			}
		}
		function S() { // Startup function (onload)
			setCanvas();
			setWrapControls();
			// Check for canvas support
			ctx = c.getContext('2d');
			if (ctx) { // Access the rendering context
				ws = connectWs(ws => ws.send('{"lv":true}')); // use parent WS or open new
				ws.addEventListener('message',(e)=>{
					try {
						if (toString.call(e.data) === '[object ArrayBuffer]') {
							let leds = new Uint8Array(e.data);
							if (leds[0] != 76 || leds[1] != 2 || !ctx) return; //'L', set in ws.cpp
							drawFrame(leds);
						}
					} catch (err) {
						console.error("Peek WS error:",err);
					}
				});
			}
		}
		// window.resize event listener
		window.addEventListener('resize', (e)=>{
			if (!throttled) {     // only run if we're not throttled
				setCanvas();      // actual callback action
				throttled = true; // we're throttled!
				setTimeout(()=>{  // set a timeout to un-throttle
					throttled = false;
				}, 250);
			}
		});
	</script>
</body>
</html>
